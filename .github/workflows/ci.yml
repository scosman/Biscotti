name: CI
on:
  push:
    branches: [main]
  pull_request:

# Pin Xcode 26.3 — the macos-15 runner defaults to Xcode 16.4, whose SwiftData
# SDK lacks Schema.Version: Sendable, breaking swift test/xcodebuild under Swift 6.
# We target the macOS 15 *platform* (deployment target), not Xcode 16.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  package-tier:
    name: Packages (lint + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode version
        run: xcodebuild -version
      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/Library/Caches/Homebrew/downloads
          key: brew-${{ hashFiles('Brewfile') }}
          restore-keys: brew-
      - name: Install dev tools
        run: brew bundle --file=Brewfile
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: Packages/BiscottiKit/.build
          key: spm-${{ hashFiles('Packages/BiscottiKit/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-
      - name: Cache pinned tools (SwiftLint)
        uses: actions/cache@v4
        with:
          path: .tools
          key: tools-${{ hashFiles('Makefile') }}
          restore-keys: tools-
      - name: Lint + test + build
        run: make ci

  # Manual test gate — verifies that every manual-test step in the results file
  # has been marked pass or fail. This is EXPECTED RED until a human runs
  # ManualTestApp on real hardware and commits the results (Phase 4.5).
  # Non-blocking (continue-on-error); informational only like app-tier.
  manual-tests-check:
    name: Manual tests check
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check manual test results
        run: make manual-tests-check

  app-tier:
    name: App build (xcodebuild)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Only xcodegen is needed here — swiftlint/swiftformat are not used,
      # and BiscottiKit is built by xcodebuild as a local package dependency.
      - name: Install dev tools
        run: brew install xcodegen
      # CI-ONLY WORKAROUND — do not mirror this locally.
      # Compiling the Icon Composer bundle App/Resources/AppIcon.icon kills
      # AssetCatalogAgent on the runner ("IBPlatformToolFailureException: The
      # tool closed the connection"), failing CompileAssetCatalogVariant. The
      # same icon builds fine on the identical Xcode 26.3 (17C529) locally, so
      # this is a headless-runner fault, not bad icon data. app-tier exists to
      # prove the app still compiles and links, which does not need the icon.
      # Deleting it here touches the runner's checkout only; the icon stays in
      # the repo and in every local/release build.
      # TODO: remove this step once the runner's Xcode can compile .icon
      # bundles; re-check by deleting it and watching this job.
      - name: Drop Icon Composer icon (CI-only workaround)
        run: rm -rf App/Resources/AppIcon.icon
      - name: Generate + build app
        run: make build-app
