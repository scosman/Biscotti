<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biscotti — Speech to Text Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#f0eee9}#root{height:100vh}a{color:#4E7D5C}a:hover{color:#43704F}</style>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#FBFAF5"/><rect x="30" y="30" width="40" height="40" rx="9" fill="#4E7D5C"/></svg></template>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="biscotti/design-canvas.jsx"></script>
<script type="text/babel" src="biscotti/stt/sttSheet.jsx"></script>
<script type="text/babel" src="biscotti/stt/sttScreens.jsx"></script>
<script type="text/babel">
const W = 1180, H = 760;
const M15 = { os: 15, rec: 'whisper', apple: 'none' };
function App() {
  return (<DesignCanvas>
    <DCSection id="onb" title="1 · Onboarding — Download Local AI Models" subtitle="Transcription row gains a model line + See all options, like the language row. Apple shows its one language (initial value from the user's locale; change it in See all options).">
      <DCArtboard id="o-apple" label="Apple recommended, already installed → ready, zero clicks" width={W} height={H}><SttOnboarding init={{}} /></DCArtboard>
      <DCArtboard id="o-apple-dl" label="Apple recommended, assets not installed" width={W} height={H}><SttOnboarding init={{ apple: 'none' }} /></DCArtboard>
      <DCArtboard id="o-whisper" label="Whisper recommended (hardware rule, or macOS 15)" width={W} height={H}><SttOnboarding init={{ rec: 'whisper' }} /></DCArtboard>
      <DCArtboard id="o-sheet" label="See all options → sheet" width={W} height={H}><SttOnboarding init={{}} sheetOpen /></DCArtboard>
    </DCSection>
    <DCSection id="b" title="2 · Speech to Text Model sheet" subtitle="Same chrome as AI Language Model sheet. Two pros + one tradeoff per row, aligned so they compare. Interactive: Download, Choose Model, Delete, inline language dropdown, Learn more.">
      <DCArtboard id="b-1" label="Default · Apple installed + recommended" width={640} height={530}><SttSheetDemo variant="b" init={{}} /></DCArtboard>
      <DCArtboard id="b-2" label="Apple not installed" width={640} height={530}><SttSheetDemo variant="b" init={{ apple: 'none' }} /></DCArtboard>
      <DCArtboard id="b-3" label="Whisper downloading" width={640} height={530}><SttSheetDemo variant="b" init={{ whisper: 'downloading', pct: { apple: 0, whisper: 41 } }} /></DCArtboard>
      <DCArtboard id="b-4" label="Whisper chosen" width={640} height={530}><SttSheetDemo variant="b" init={{ whisper: 'ready', selected: 'whisper' }} /></DCArtboard>
      <DCArtboard id="b-5" label="Whisper recommended (hardware rule)" width={640} height={530}><SttSheetDemo variant="b" init={{ rec: 'whisper' }} /></DCArtboard>
      <DCArtboard id="b-6" label="macOS 15 · Apple unavailable" width={640} height={530}><SttSheetDemo variant="b" init={M15} /></DCArtboard>
      <DCArtboard id="b-8" label="1 language · inline dropdown open" width={640} height={530}><SttSheetDemo variant="b" init={{ picker: true }} /></DCArtboard>
      <DCArtboard id="b-7" label="macOS 15 · Learn more → upgrade dialog" width={640} height={530}><SttSheetDemo variant="b" init={{ ...M15, alert: true }} /></DCArtboard>
    </DCSection>
    <DCSection id="set" title="3 · Settings" subtitle="New row in AI Enhancements, beside AI Language Model Manage opens the same sheet. With Apple active, Custom Vocabulary shows off; turning it on asks to switch to Whisper.">
      <DCArtboard id="s-1" label="AI Enhancements · new Speech to Text Model row" width={760} height={560}><SttSettings init={{}} /></DCArtboard>
      <DCArtboard id="s-2" label="Manage → sheet" width={760} height={560}><SttSettings init={{}} sheetOpen /></DCArtboard>
      <DCArtboard id="s-3" label="Custom Vocabulary on, with Apple active → alert" width={760} height={560}><SttSettings init={{}} vocabAlert /></DCArtboard>
    </DCSection>
  </DesignCanvas>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
